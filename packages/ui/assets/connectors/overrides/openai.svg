<!-- OpenAI logomark, white, for OpenAI's own black tile.
     simple-icons does not carry the brand at all — reason 3 in this
     directory's README — so the mark is vendored here.

     Three things differ from the upstream artwork, all deliberate. The
     six-fold symmetry is written out as explicit rotations rather than the
     <use xlink:href> the source uses, because the Xcode asset pipeline does
     not resolve references and renders an empty tile from them. The viewBox
     is cropped to the blossom, which upstream is padded to sit inside a
     rounded app-icon tile. And the fill is white rather than black: this is
     a BRAND_TILE mark, so it sits on #000000 — the tile OpenAI actually
     ships — instead of being silhouetted onto the panel's glass, which left
     it the only connector in the notch without a tile of its own.
-->
