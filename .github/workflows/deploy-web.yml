name: Deploy the website

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      # /changelog is built from the Mac app's changelog, so a release that
      # changes nothing else still has to rebuild the site. Without this a
      # release tags, builds and mirrors, and the page it points at — the
      # `notes` URL in latest.json — keeps describing the previous version,
      # with the anchor for the new one missing entirely.
      - "apps/mac/CHANGELOG.md"
      # Every /sources page is generated from the provider manifests, so a
      # connector change is a site change with nothing under apps/web to show
      # for it. Without this a new provider, a new metric, or a promotion out
      # of beta lands on main, passes CI, and never reaches the site — until
      # some unrelated web edit happens to deploy it. That is how three
      # connectors kept a "Beta" badge for a day after the release that
      # removed it.
      - "packages/integrations/**"
      - "packages/ui/**"
      - "packages/env/**"
      - "packages/schemas/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Next inlines NEXT_PUBLIC_* at build time, so these must be present here
      # and not only on the deployment. A change to one needs a rebuild, not a
      # redeploy.
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://notchmetrics.com' }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.notchmetrics.com' }}
      NEXT_PUBLIC_ASSETS_URL: ${{ vars.NOTCH_ASSETS_URL || 'https://assets.notchmetrics.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # `@notch/schemas` imports `@notchmetrics/core` by package name, and that
      # package's `exports` point at `dist/`. Without this the deploy resolves
      # nothing: Turbopack reports "Can't resolve '@notchmetrics/core'" and
      # `tsc` reports TS2307, both only on CI, because a local checkout has a
      # `dist/` left behind by an earlier build. Same shape as the `emit` task
      # needing `dependsOn: ["^build"]`.
      - run: pnpm turbo run build --filter=@notchmetrics/core
      - run: pnpm --filter @notch/web run deploy
