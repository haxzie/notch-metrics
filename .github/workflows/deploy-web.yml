name: Deploy the website

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      # /changelog is built from the Mac app's changelog, so a release that
      # changes nothing else still has to rebuild the site. Without this a
      # release tags, builds and mirrors, and the page it points at — the
      # `notes` URL in latest.json — keeps describing the previous version,
      # with the anchor for the new one missing entirely.
      - "apps/mac/CHANGELOG.md"
      - "packages/ui/**"
      - "packages/env/**"
      - "packages/schemas/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Next inlines NEXT_PUBLIC_* at build time, so these must be present here
      # and not only on the deployment. A change to one needs a rebuild, not a
      # redeploy.
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://notchmetrics.com' }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.notchmetrics.com' }}
      NEXT_PUBLIC_ASSETS_URL: ${{ vars.NOTCH_ASSETS_URL || 'https://assets.notchmetrics.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @notch/web run deploy
