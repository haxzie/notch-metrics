name: Version and publish

on:
  push:
    branches: [main]

concurrency:
  group: version
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The Mac build number is `git rev-list --count HEAD`, which is wrong
          # and plausible at depth 1.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Open or merge the Version Packages PR
        id: changesets
        uses: changesets/action@v1
        with:
          # `pnpm run version` also regenerates apps/mac/Config/Version.xcconfig,
          # so the Version Packages PR carries the Mac app's version with it.
          version: pnpm run version
          # Deliberately no `publish:`.
          #
          # Every package in the workspace is private, so `changeset publish`
          # has nothing to do — but it would still run, still need an
          # `NPM_TOKEN` that does not exist, and still fail the job. The only
          # thing this workflow releases is the Mac app, and that goes out as
          # a tag. Put `publish: pnpm run release` back, with the secret,
          # when something here is actually meant to reach npm.
          commit: "Version packages"
          title: "Version packages"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the Mac release
        # NOT gated on `steps.changesets.outputs.published`.
        #
        # That output means "changeset publish pushed something to npm", which
        # is now never, so the gate would hold the release back for ever with
        # nothing anywhere saying why — the same silent no-op as a tag pushed
        # with GITHUB_TOKEN, and harder to spot because the job is green.
        #
        # The condition below is the one that was always meant: main has no
        # unconsumed changesets, so the version in apps/mac/package.json is a
        # version that has been through the Version PR. Tagging it is then
        # idempotent — the tag either exists already or is the release — which
        # also makes it self-healing, because a tag push that failed is retried
        # by the next push to main.
        env:
          # NOT GITHUB_TOKEN.
          #
          # A tag pushed with the automatic token raises no `push` event —
          # GitHub's recursion guard — so release-mac.yml would simply never
          # run, with nothing anywhere saying why. This is the single most
          # likely way for a release to silently do nothing.
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail

          # Everything here reads $GITHUB_SHA — the commit that was pushed to
          # main — and never the working tree or HEAD.
          #
          # `changesets/action` runs `pnpm run version` in this workspace to
          # build the Version PR: that consumes .changeset/*.md, bumps
          # package.json, and leaves HEAD on the commit it made on the PR
          # branch. A step reading the working tree therefore sees the *next*
          # version with no changesets pending, on every run — so this tagged
          # 0.3.0 while the Version PR was still open, pointing at a commit
          # that was not on main and never would be once the PR was squashed.
          pending=$(git ls-tree -r --name-only "$GITHUB_SHA" .changeset \
            | grep '\.md$' | grep -cv '/README\.md$' || true)
          if [ "${pending:-0}" != "0" ]; then
            echo "$pending changeset(s) still pending on main; the Version PR is not merged yet."
            exit 0
          fi

          version=$(git show "$GITHUB_SHA:apps/mac/package.json" \
            | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          tag="mac-v$version"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; nothing to do."
            exit 0
          fi

          # Created through the API, not with `git push`.
          #
          # `git push` here looked like it worked and raised no `push` event,
          # so release-mac.yml never ran. Setting the remote URL to carry the
          # PAT is not enough: `actions/checkout` leaves an
          # `http.https://github.com/.extraheader` credential in the repository
          # config, git sends that Authorization header in preference to the
          # basic auth in the URL, and the push is therefore attributed to
          # GITHUB_TOKEN — whose events GitHub's recursion guard suppresses.
          # That is the single most likely way for a release to do nothing,
          # and the previous mitigation was defeated by a config setting
          # written by another action.
          #
          # `gh api` reads GH_TOKEN directly, so there is exactly one
          # credential in play and no git config can override it.
          #
          # Two calls: a tag *object*, then the ref that points at it. The
          # one-call form creates a lightweight tag, and `gh release create
          # --verify-tag` plus `release-notes.mjs` both expect an annotated one.
          object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$tag" -f message="Notch Metrics $version" \
            -f object="$GITHUB_SHA" -f type=commit --jq .sha)

          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$tag" -f sha="$object" --jq .ref

          echo "pushed $tag at $GITHUB_SHA — release-mac.yml takes it from here."

          # The push event is what actually matters, and it is asynchronous.
          # Say plainly where to look if nothing happens, because the failure
          # this guards against is silent by construction.
          echo "If no 'Release the Mac app' run appears, RELEASE_PAT is the first thing to check."
