name: Version and publish

on:
  push:
    branches: [main]

concurrency:
  group: version
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The Mac build number is `git rev-list --count HEAD`, which is wrong
          # and plausible at depth 1.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Open or merge the Version Packages PR
        id: changesets
        uses: changesets/action@v1
        with:
          # `pnpm run version` also regenerates apps/mac/Config/Version.xcconfig,
          # so the Version Packages PR carries the Mac app's version with it.
          version: pnpm run version
          # Deliberately no `publish:`.
          #
          # Every package in the workspace is private, so `changeset publish`
          # has nothing to do — but it would still run, still need an
          # `NPM_TOKEN` that does not exist, and still fail the job. The only
          # thing this workflow releases is the Mac app, and that goes out as
          # a tag. Put `publish: pnpm run release` back, with the secret,
          # when something here is actually meant to reach npm.
          commit: "Version packages"
          title: "Version packages"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the Mac release
        # NOT gated on `steps.changesets.outputs.published`.
        #
        # That output means "changeset publish pushed something to npm", which
        # is now never, so the gate would hold the release back for ever with
        # nothing anywhere saying why — the same silent no-op as a tag pushed
        # with GITHUB_TOKEN, and harder to spot because the job is green.
        #
        # The condition below is the one that was always meant: main has no
        # unconsumed changesets, so the version in apps/mac/package.json is a
        # version that has been through the Version PR. Tagging it is then
        # idempotent — the tag either exists already or is the release — which
        # also makes it self-healing, because a tag push that failed is retried
        # by the next push to main.
        env:
          # NOT GITHUB_TOKEN.
          #
          # A tag pushed with the automatic token raises no `push` event —
          # GitHub's recursion guard — so release-mac.yml would simply never
          # run, with nothing anywhere saying why. This is the single most
          # likely way for a release to silently do nothing.
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail

          # Anything other than README.md and config.json is a pending
          # changeset, which means the Version PR is open and this version is
          # not the one to release.
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          if [ "$pending" != "0" ]; then
            echo "$pending changeset(s) still pending; the Version PR is not merged yet."
            exit 0
          fi

          version=$(node -p "require('./apps/mac/package.json').version")
          tag="mac-v$version"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Annotated. `--follow-tags` pushes annotated tags only and silently
          # ignores lightweight ones, so `git tag "$tag"` here would look like
          # it worked and leave the tag nowhere.
          git tag -a "$tag" -m "Notch Metrics $version"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "$tag"
          echo "pushed $tag — release-mac.yml takes it from here."
