name: Deploy the API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/logs/**"
      - "packages/db/**"
      - "packages/schemas/**"
      - "packages/integrations/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  # Never cancel. A run stopped between applying migrations and deploying
  # leaves the schema ahead of the code, which is the one state nothing here
  # recovers from automatically.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # `@notch/schemas` imports `@notchmetrics/core` by package name, and that
      # package's `exports` point at `dist/`. Without this the deploy resolves
      # nothing: Turbopack reports "Can't resolve '@notchmetrics/core'" and
      # `tsc` reports TS2307, both only on CI, because a local checkout has a
      # `dist/` left behind by an earlier build. Same shape as the `emit` task
      # needing `dependsOn: ["^build"]`.
      - run: pnpm turbo run build --filter=@notchmetrics/core
      - run: pnpm --filter @notch/api typecheck
      - run: pnpm --filter @notch/api test
      - run: pnpm --filter @notch/logs typecheck
      - run: pnpm --filter @notch/logs test

      # Before the API, which names this Worker as its `tail_consumers`
      # service. Cloudflare does not reject a deploy that names a consumer
      # which does not exist — it accepts it and delivers nothing — so the
      # ordering is what keeps a first deploy from quietly shipping no logs
      # at all. Running it every time also stops the shipper lagging the
      # thing it ships for; it is three kilobytes and has no migrations.
      - run: pnpm --filter @notch/logs run deploy

      - name: Apply migrations
        # Strictly before the deploy. Migrations in this repository only ever
        # add, so the old code keeps working against the new schema for the few
        # seconds in between. The other order puts new code live against a
        # schema that does not have its tables yet.
        run: pnpm --filter @notch/api migrate:remote

      # `run` is not optional. Without it pnpm resolves `deploy` to its own
      # built-in (the one that packs a workspace into a directory) and fails
      # with "This command requires one parameter" rather than running the
      # script of that name.
      - run: pnpm --filter @notch/api run deploy
