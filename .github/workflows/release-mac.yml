name: Release the Mac app

on:
  push:
    tags: ["mac-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing mac-v* tag to re-release"
        required: true
        type: string

concurrency:
  group: release-mac
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Needed by the build number (git rev-list --count) and by
          # `gh release create`. Without it the count is wrong and plausible.
          fetch-depth: 0

      - id: meta
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#mac-v}" >> "$GITHUB_OUTPUT"

      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$xcode" ] || { echo "::error::no Xcode 26 on this runner image"; exit 1; }
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"

      - run: brew install xcodegen create-dmg

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Generate the project against production URLs
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.notchmetrics.com' }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://notchmetrics.com' }}
          NEXT_PUBLIC_ASSETS_URL: ${{ vars.NOTCH_ASSETS_URL || 'https://assets.notchmetrics.com' }}
        run: ./scripts/mac.sh gen

      - name: Pre-flight
        # Before anything is signed. The one bug class that only surfaces after
        # shipping is a notarised image whose Sign In button opens localhost.
        env:
          GITHUB_REF_NAME: ${{ steps.meta.outputs.tag }}
        run: node scripts/check-release-env.mjs

      - name: Import the signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$CSC_LINK" ] || { echo "::error::CSC_LINK is not set."; exit 1; }

          KEYCHAIN="$RUNNER_TEMP/notch.keychain-db"
          KPW="$(uuidgen)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"

          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security

          # Mandatory. Without it codesign blocks on a GUI authorisation prompt
          # that can never be answered on a headless runner, and the job sits
          # there until the six-hour limit.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KEYCHAIN" >/dev/null

          # The new keychain must be in the *search list* or xcodebuild cannot
          # see the identity at all — it reports "0 valid identities found"
          # with the certificate sitting right there.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # An Apple Distribution certificate signs happily and Gatekeeper
          # still refuses the download, so the failure lands on users rather
          # than in this log.
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" || {
            echo "::error::CSC_LINK is not a Developer ID Application certificate."
            exit 1
          }
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Provide the notarisation key
        id: notary
        env:
          KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          [ -n "$KEY" ] || { echo "::error::APPLE_API_KEY_BASE64 is not set."; exit 1; }
          # notarytool wants --key <path>, not the key itself. The name of the
          # secret says BASE64 for exactly this reason.
          path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$KEY" | base64 --decode > "$path"
          chmod 600 "$path"
          echo "APPLE_API_KEY=$path" >> "$GITHUB_ENV"

      - name: Build and export
        run: ./scripts/build-mac.sh

      - name: Sign, notarise and staple the app
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: ./scripts/sign-and-notarize.sh apps/mac/build/export/NotchMetrics.app

      - name: Build the disk image
        run: ./scripts/make-dmg.sh

      - name: Sign, notarise and staple the disk image
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: ./scripts/sign-and-notarize.sh "apps/mac/build/NotchMetrics-${{ steps.meta.outputs.version }}-arm64.dmg"

      - name: Zip the app for people whose MDM blocks disk images
        run: |
          /usr/bin/ditto -c -k --keepParent --sequesterRsrc \
            apps/mac/build/export/NotchMetrics.app \
            "apps/mac/build/NotchMetrics-${{ steps.meta.outputs.version }}-arm64.zip"

      - name: Keep the raw build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: apps/mac/build/archive.log
          retention-days: 14

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          node scripts/release-notes.mjs "$VERSION" > apps/mac/build/notes.md
          gh release create "$TAG" \
            "apps/mac/build/NotchMetrics-$VERSION-arm64.dmg" \
            "apps/mac/build/NotchMetrics-$VERSION-arm64.zip" \
            --title "Notch Metrics $VERSION" \
            --notes-file apps/mac/build/notes.md \
            --verify-tag

      - name: Remove the temporary keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true

  mirror:
    needs: build
    uses: ./.github/workflows/release-mirror.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
    secrets: inherit
